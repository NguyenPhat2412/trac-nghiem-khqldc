services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vju_quiz
      POSTGRES_USER: vju
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["./data/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vju -d vju_quiz"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/vju_quiz
      DATABASE_USER: vju
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  test-backend:
    profiles: ["test"]
    image: vju-quiz-backend
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/vju_quiz_test
      DATABASE_USER: vju
      SEED_DEMO: "true"
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8080
    depends_on: [backend]
    restart: unless-stopped
  gateway:
    image: nginx:alpine
    ports: ["127.0.0.1:3000:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [frontend, backend]
    restart: unless-stopped
