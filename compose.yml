services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vju_quiz
      POSTGRES_USER: vju
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["./data/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vju -d vju_quiz"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/vju_quiz
      DATABASE_USER: vju
      SERVER_FORWARD_HEADERS_STRATEGY: native
      SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES: '\Q${QUIZ_GATEWAY_IP:-172.30.42.2}\E'
    networks: [default, ingress]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  test-backend:
    profiles: ["test"]
    image: vju-quiz-backend
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/vju_quiz_test
      DATABASE_USER: vju
      SEED_DEMO: "true"
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8080
    depends_on: [backend]
    networks: [default, ingress]
    restart: unless-stopped
  gateway:
    image: nginx:alpine
    ports: ["127.0.0.1:3000:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/trusted-proxy:/etc/nginx/trusted-proxy:ro
    depends_on: [frontend, backend]
    networks:
      ingress:
        ipv4_address: ${QUIZ_GATEWAY_IP:-172.30.42.2}
    restart: unless-stopped
networks:
  ingress:
    ipam:
      config:
        - subnet: ${QUIZ_INGRESS_SUBNET:-172.30.42.0/24}
          ip_range: ${QUIZ_INGRESS_RANGE:-172.30.42.128/25}
